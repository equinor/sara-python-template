name: Promote to Production

# New repository checklist — this workflow will not authenticate until all
# three are done:
#
#   1. Create the GitHub Environment named below (Development / Staging /
#      Production). The federated credential matches on its name, including
#      casing.
#   2. Add this repository to `automation/aks/gha-push-<env>.bicepparam` in
#      equinor/robotics-infrastructure and deploy `gha-push-identity.bicep`.
#   3. Set the `ACR_PUSH_CLIENT_ID` environment variable to that identity's
#      client ID. `AZURE_TENANT_ID` and `AZURE_SUBSCRIPTION_ID` are inherited
#      from the organisation.
#
# There is no registry password to request; authentication is via OIDC.

concurrency:
  group: production-concurrency
  cancel-in-progress: true

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  promote:
    # The template itself has no environment, no federated credential and only
    # a placeholder image name, so it cannot publish. Generated repositories do
    # not match this condition and run normally.
    if: github.repository != 'equinor/sara-python-template'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: equinor/armada/.github/workflows/promote_to_production.yml@main
    with:
      image_name: robotics/sara-service
      staging_registry: roboticsstagingacr.azurecr.io
      production_registry: roboticsprodacr.azurecr.io
      infrastructure_repository: equinor/robotics-infrastructure
      kustomization_base_path: k8s_kustomize/analytics/overlays
      author_name: ${{ github.actor }}
      environment: Production
      use_oidc: true
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    secrets:
      deploy_key: ${{ secrets.ANALYTICS_INFRASTRUCTURE_DEPLOY_KEY }}
